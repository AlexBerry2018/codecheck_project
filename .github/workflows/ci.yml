name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also bring the stack up and run scripts/e2e.py"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: courses-service/Dockerfile
          ignore: DL3008,DL3013,DL3042
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: submissions-service/Dockerfile
          ignore: DL3008,DL3013,DL3042
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: grader-service/Dockerfile
          ignore: DL3008,DL3013,DL3042

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [courses-service, submissions-service, grader-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, compose, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all service images
        run: docker compose build

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Run the acceptance walkthrough
        run: python3 scripts/e2e.py --rate-limit
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v

# pip install pre-commit && pre-commit install      (then it runs on every `git commit`)
# pre-commit run --all-files                         (check everything once)
# pre-commit autoupdate                              (bump the pinned revisions)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff            # lint only, config in ruff.toml; no auto-format to keep diffs small

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker # needs Docker; checks the three Dockerfiles
        args: ["--ignore", "DL3008", "--ignore", "DL3013"]
